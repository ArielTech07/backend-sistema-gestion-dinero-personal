# ==============================================================================
# CONFIGURACIÓN GENERAL DEL SERVIDOR
# ==============================================================================
spring.application.name=gestion_dinero
server.port=${PORT:8080}

# ==============================================================================
# CONEXIÓN A LA BASE DE DATOS (POSTGRESQL / SUPABASE)
# ==============================================================================
# Usa variables de entorno para que las credenciales nunca se expongan en el código.
# En local: toma los valores tras los dos puntos (:).
# En producción (Render / Railway / etc.): toma DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_dinero_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Optimización del Pool de Conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}

# ==============================================================================
# SEGURIDAD DEL ADMINISTRADOR INICIAL Y TOKENS JWT
# ==============================================================================
# En producción o local se definen vía variables de entorno (ADMIN_EMAIL, ADMIN_PASSWORD, JWT_SECRET).
# No dejamos contraseñas ni correos reales quemados en este archivo.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.jwt.secret=${JWT_SECRET:GeneraUnaClaveSecretaLargaDeAlMenos32CaracteresParaProduccion}

# Orígenes permitidos para el Frontend (CORS)
# En local permite localhost; en producción define CORS_ALLOWED_ORIGINS (ej: https://mi-frontend.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# ==============================================================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ==============================================================================
# 'update' en desarrollo crea/modifica tablas sin borrar datos.
# En producción puedes sobreescribirlo con DDL_AUTO=validate si ejecutas migraciones.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Mostrar SQL solo cuando sea necesario (en producción por defecto false para evitar exponer datos en logs)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Desactiva Open Session In View (OSIV) para mejor rendimiento y seguridad
spring.jpa.open-in-view=false

# ==============================================================================
# GOOGLE CALENDAR API (Service Account)
# ==============================================================================

# Ruta al archivo JSON de credenciales de la Service Account:
google.calendar.credentials-path=${GOOGLE_CALENDAR_CREDENTIALS:classpath:google-calendar-credentials.json}


# Calendar ID del calendario donde se crearán los eventos de cobro.
google.calendar.calendar-id=${GOOGLE_CALENDAR_ID:primary}
# Zona horaria para los eventos
google.calendar.timezone=${GOOGLE_CALENDAR_TIMEZONE:America/Lima}